name: civic_route
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  geolocator: ^14.0.3
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  icons_launcher: ^3.0.3

icons_launcher:
  image_path: "assets/icon/icon_light.png"
  platforms:
    android:
      enable: true
      image_path: "assets/icon/icon_light.png"
    ios:
      enable: true
      image_path: "assets/icon/icon_light.png"
      dark_path: "assets/icon/icon_dark.png"

flutter:
  uses-material-design: true
  assets:
    - .env
